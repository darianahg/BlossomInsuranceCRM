<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Usuarios del sistema</h4>
        <a th:href="@{/users/new}" class="btn btn-primary">+ Nuevo usuario</a>
    </div>

    <div class="card p-3">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Usuario</th>
                <th>Rol</th>
                <th>Estado</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.fullName}">Nombre</td>
                <td th:text="${u.username}">usuario</td>
                <td>
                    <span class="badge" th:classappend="${u.role.name() == 'ADMIN'} ? 'bg-warning text-dark' : 'bg-info text-dark'"
                          th:text="${u.role}">AGENT</span>
                </td>
                <td>
                    <span class="badge" th:classappend="${u.active} ? 'bg-success' : 'bg-secondary'"
                          th:text="${u.active} ? 'Activo' : 'Inactivo'">Activo</span>
                </td>
                <td class="text-end">
                    <form th:action="@{'/users/' + ${u.id} + '/toggle-active'}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-secondary"
                                th:text="${u.active} ? 'Desactivar' : 'Activar'">Desactivar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="text-muted small mb-0">
            Un usuario desactivado no puede iniciar sesión, pero conserva su historial de clientes y contratos.
        </p>
    </div>
</div>

</body>
</html>
