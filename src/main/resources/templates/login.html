<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión · Blossom</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link th:href="@{/css/blossom.css}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #AD1457, #D6336C 45%, #F48FB1);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            margin: auto;
            border: none;
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(0,0,0,.25);
        }
        .brand-title {
            font-family: 'Pacifico', cursive;
            font-size: 2.4rem;
            color: var(--blossom-deep);
        }
    </style>
</head>
<body>
<div class="card login-card p-4">
    <div class="card-body">
        <h1 class="text-center brand-title mb-0">🌸 Blossom</h1>
        <p class="text-center text-muted mb-4">CRM de seguros · clientes y contratos</p>

        <div class="alert alert-danger py-2" th:if="${param.error}">
            Usuario o contraseña incorrectos.
        </div>
        <div class="alert alert-success py-2" th:if="${param.logout}">
            Sesión cerrada correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>

        <hr>
        <p class="small text-muted mb-0 text-center">
            Demo: <strong>admin / admin123</strong> (administrador)<br>
            <strong>agente1 / agente123</strong> (agente)
        </p>
    </div>
</div>
</body>
</html>
