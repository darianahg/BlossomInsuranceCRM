# ==== Servidor ====
server.port=8080

# ==== Base de datos H2 (archivo local, no requiere instalar nada) ====
# Los datos quedan guardados en la carpeta /data del proyecto entre reinicios.
spring.datasource.url=jdbc:h2:file:./data/segurosdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 para ver las tablas en el navegador: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==== JPA / Hibernate ====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==== Thymeleaf ====
spring.thymeleaf.cache=false

# ==== Nota para migrar a SQL Server despues ====
# Cuando quieras pasar a SQL Server, solo cambias estas 4 lineas de arriba por:
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=segurosdb;encrypt=false
# spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# y agregas la dependencia del driver JDBC de SQL Server en el pom.xml
